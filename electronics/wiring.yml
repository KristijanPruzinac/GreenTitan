  - [DRV_R, MOT_R, ["A+=#222222", "A-=#388e3c", "B+=#d32f2f", "B-=#1976d2"], "bare leads", true]
  - [BLD, BLADE, ["U=#ef6c00", "V=#388e3c", "W=#6d4c41", "5V=#d32f2f", "GND=#222222", "HA=#f9a825", "HB=#bdbdbd", "HC=#1976d2"], "bare leads, MA=U MB=V MC=W", true]
  - [CHARGER, ST_POGO, power, "DC socket for its plug, soldered"]
  - [ST_POGO, CHARGE, power, "magnetic contact when docked", true]
  - [CHARGE, DIODE, power, "soldered"]
  - [DIODE, BATT, power, "joins + after the shunt"]
  - [CHARGE, carrier, [DOCK+, GND], "dock sense, 2 wires"]
