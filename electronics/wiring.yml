# Picture of how the parts connect (wiring.py -> wiring.svg). Edit here, then run render.sh.
# nodes: id: {at: [x, y] centre, size: [w, h], label, img (optional), status: owned | buy | board, on: carrier (drawn on the board)}
# links: [from, to, wires, label, confirmed]  wires = signal names (one drawn wire each, "name=#colour" for a real lead colour), or "ribbon" / "usb" / "coax" / "power"
#        confirmed: true only if both ends' real terminals are checked and they fit together
# term: [what the part really has to connect to, true if checked against the bought listing or the maker's document]
# NOT CONFIRMED as a whole: only the cables marked true are checked end to end; the rest only show which part talks to which.
canvas: [1900, 1340]
carrier: {at: [930, 560], size: [460, 520], label: "Carrier board (own PCB, not designed)"}
nodes:
  ESP32:    {at: [930, 450],  size: [150, 110], label: ESP32 devboard, img: img/esp32.jpg, status: owned, on: carrier, term: ["HW-394: 2x15 pin headers 2.54 mm + USB-C; came with a screw-terminal breakout", true]}
  IMU:      {at: [800, 640],  size: [90, 70],   label: IMU ICM-42688-P, img: img/imu.jpg, status: buy, on: carrier, term: ["not bought", false]}
  INA226:   {at: [1060, 640], size: [90, 70],   label: INA226 battery monitor, img: img/ina226.jpg, status: buy, on: carrier, term: ["not bought", false]}
  HCT245:   {at: [930, 740],  size: [100, 60],  label: 74HCT245 (5 V signals), img: img/hct245.jpg, status: board, on: carrier, term: ["not bought", false]}

  TOF_L:    {at: [330, 120],  size: [120, 90],  label: "ToF 8x8, front left", img: img/tof_8x8.jpg, status: owned, term: ["9 bare holes 2.54 mm + loose pin header: VIN GND SDA SCL MISO LPn INT NCS SPI_I2C_N. I2C: NCS + SPI_I2C_N to GND", true]}
  TOF_R:    {at: [330, 300],  size: [120, 90],  label: "ToF 8x8, front right", img: img/tof_8x8.jpg, status: owned, term: ["9 bare holes 2.54 mm + loose pin header: VIN GND SDA SCL MISO LPn INT NCS SPI_I2C_N. I2C: NCS + SPI_I2C_N to GND", true]}
  C94:      {at: [330, 520],  size: [160, 120], label: C94-M8P RTK board, img: img/c94.jpg, status: owned, term: ["J8 = 2x10 socket, 2.54 mm, with the UART (checked on the owned board); the ribbon goes in through a 2x10 pin header with long pins on both sides", true]}
  ANT_GNSS: {at: [90, 450],   size: [100, 80],  label: GNSS antenna, status: owned, term: ["SMA plug on a fixed cable", true]}
  ANT_UHF:  {at: [90, 600],   size: [100, 80],  label: UHF whip, status: owned, term: ["SMA", true]}
  DEBUG:    {at: [330, 720],  size: [120, 80],  label: "USB-UART (bench only)", img: img/usb_uart.jpg, status: owned, term: ["bought as variants CP2102 and CH9102; pin row not read off the boards", false]}
  PHONE:    {at: [110, 900],  size: [110, 170], label: Galaxy A12 phone, status: owned, term: ["USB-C socket", true]}
  OTG:      {at: [360, 900],  size: [130, 70],  label: "USB-C OTG adapter (data + charge)", status: buy, term: ["not bought", false]}
  USBC:     {at: [360, 1080], size: [130, 60],  label: "USB-C plug, screw terminal", status: buy, term: ["not bought", false]}

  DRV_L:    {at: [1450, 130], size: [130, 120], label: "DM542T driver, left", img: img/dm542t.jpg, status: owned, term: ["screw terminals: PUL DIR ENA +/- (6, a 4-wire cable needs the 3 minus bridged), V+ GND, A+ A- B+ B-", true]}
  DRV_R:    {at: [1450, 400], size: [130, 120], label: "DM542T driver, right", img: img/dm542t.jpg, status: owned, term: ["screw terminals: PUL DIR ENA +/- (6, a 4-wire cable needs the 3 minus bridged), V+ GND, A+ A- B+ B-", true]}
  MOT_L:    {at: [1750, 130], size: [150, 120], label: "Stepper + 10:1 gearbox, left", img: img/stepper_gearbox.jpg, status: owned, term: ["4 bare leads AWG20, 300 mm: black A+, green A-, red B+, blue B- (datasheet)", true]}
  MOT_R:    {at: [1750, 400], size: [150, 120], label: "Stepper + 10:1 gearbox, right", img: img/stepper_gearbox.jpg, status: owned, term: ["4 bare leads AWG20, 300 mm: black A+, green A-, red B+, blue B- (datasheet)", true]}
  BLD:      {at: [1450, 670], size: [130, 120], label: BLD-510B blade driver, img: img/bld510b.jpg, status: owned, term: ["plug-in screw terminals: V+ GND MA MB MC / GND HA HB HC +5V / GND F/R EN BK SV PG ALM +5V (maker photo)", true]}
  BLADE:    {at: [1750, 670], size: [150, 120], label: 57BLR90 blade motor, img: img/blade_motor.jpg, status: owned, term: ["8 bare leads, 300 mm: U orange, V green, W brown, +5V red, GND black, A yellow, B white, C blue (maker page)", true]}

  CHARGE:   {at: [800, 1160], size: [120, 90],  label: "Charge port (magnetic pogo)", img: img/pogo.jpg, status: owned, term: ["no wires: solder pin (centre) + 2 solder tabs (shell), 8 mm", true]}
  BATT:     {at: [1050, 1160], size: [160, 110], label: 7S3P battery 25.9 V, img: img/battery.jpg, status: buy, term: ["not bought", false]}
  ESTOP:    {at: [1300, 1160], size: [110, 90], label: E-stop, img: img/estop.jpg, status: buy, term: ["not bought", false]}
  BUCK:     {at: [1180, 930], size: [130, 90],  label: 24 V to 5 V buck, img: img/buck.jpg, status: owned, term: ["4 bare leads: red/black in, yellow/black out", true]}
  DIST:     {at: [1270, 400], size: [50, 700],  label: "24 V", status: board, term: ["not designed", false]}

