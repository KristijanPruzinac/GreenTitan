  OTG:      {at: [360, 900],  size: [130, 70],  label: "USB-C OTG adapter (data + charge)", status: buy}
  USBC:     {at: [360, 1080], size: [130, 60],  label: "USB-C plug, screw terminal", status: buy}

  DRV_L:    {at: [1450, 130], size: [130, 120], label: "DM542T driver, left", img: img/dm542t.jpg, status: owned}
