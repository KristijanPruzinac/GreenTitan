# Picture of how the parts connect (wiring.py -> wiring.svg). Edit here, then run render.sh.
# nodes: id: {at: [x, y] centre, size: [w, h], label, img (optional), status: owned | buy | board, on: carrier (drawn on the board)}
# links: [from, to, wires, label]  wires = signal names (one drawn wire each), or "ribbon" / "usb" / "coax" / "power"
# Nothing here is a decided connector type; it shows which part connects to which, with how many wires.
canvas: [1900, 1300]
carrier: {at: [930, 560], size: [460, 520], label: "Carrier board (own PCB)"}
nodes:
  ESP32:    {at: [930, 450],  size: [150, 110], label: ESP32 devboard, img: img/esp32.jpg, status: owned, on: carrier}
  IMU:      {at: [800, 640],  size: [90, 70],   label: IMU ICM-42688-P, img: img/imu.jpg, status: buy, on: carrier}
  INA226:   {at: [1060, 640], size: [90, 70],   label: INA226 battery monitor, img: img/ina226.jpg, status: buy, on: carrier}
  HCT245:   {at: [930, 740],  size: [100, 60],  label: 74HCT245 (5 V signals), img: img/hct245.jpg, status: board, on: carrier}

  TOF_L:    {at: [330, 120],  size: [120, 90],  label: "ToF 8x8, front left", img: img/tof_8x8.jpg, status: owned}
