  - [carrier, DRV_R, ["PUL+", "PUL-", "DIR+", "DIR-", "ENA+", "ENA-"], "owned 6-core cable"]
  - [carrier, BLD, [SV, GND], "5 V on SV = run; 1 kOhm SV-GND at the driver:"]
