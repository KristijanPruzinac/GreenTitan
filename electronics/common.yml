# GreenTitan parts map, shared part definitions (WireViz, https://github.com/wireviz/WireViz).
# Every electrical part is defined once here; the sheets (signals, drive, power) pick parts and connect them.
# Render all sheets:  electronics/render.sh
# Title colour: green = owned, yellow = to buy, blue = on the own carrier board.
# ESP32 pin numbers come from src/definitions.h. "?" = not confirmed.
# Connector types and the wiring itself are NOT decided: this map is for keeping track of parts and pins.
# NOT CONFIRMED: see wiring.svg and docs/HARDWARE.md (connection audit) for what is checked.
# Photos in img/: ESP32, ToF, pogo and buck are from the bought listings, the C94 from the u-blox user guide, DM542T/BLD-510B/blade motor from the maker; the rest are placeholders.

options:
  bgcolor: WH
  fontname: arial

parts:
  - &ESP32
    bgcolor_title: "#bfe8bf"
    type: ESP32 devboard (ESP-WROOM-32, USB-C), socketed on the carrier
    image: {src: img/esp32.jpg, height: 110}
    hide_disconnected_pins: true
    pinlabels: [5V, 3V3, GND, USB,
                GPIO19, GPIO32, GPIO26, GPIO33, GPIO18,
                GPIO16, GPIO17,
                GPIO21, GPIO22,
                GPIO25, GPIO23, GPIO4, GPIO14,
                GPIO34, GPIO36, GPIO39, GPIO2]
    notes: "Only the pins used on this sheet are shown. USB = micro-ROS link (UART0, 921600). Unused: GPIO36 battery ADC, GPIO39 rain, GPIO13/27 debug console (no adapter on the mower). GPIO2 = status LED."
  - &HCT245
    bgcolor_title: "#bcd6ff"
    type: 74ACT245 buffer at 5 V (proposed; 3.3 V in, 5 V out, 24 mA)
    image: {src: img/hct245.jpg, height: 80}
    pinlabels: [A1, A2, A3, A4, B1, B2, B3, B4]
    notes: "The DM542T inputs take 7-16 mA; the 74HCT245 is specified to 6 mA, the ACT to 24 mA (same pinout)"
  - &IMU
    bgcolor_title: "#ffe08a"
    type: ICM-42688-P module, on the carrier
    image: {src: img/imu.jpg, height: 80}
    pinlabels: [VCC 3V3, GND, SDA, SCL]
  - &INA226
    bgcolor_title: "#ffe08a"
    type: INA226 module, on the carrier, 2 mOhm shunt
    image: {src: img/ina226.jpg, height: 80}
    hide_disconnected_pins: true
    pinlabels: [VCC 3V3, GND, SDA, SCL, IN+, IN-]
    notes: pack voltage and current
  - &PORT_PWR {bgcolor_title: "#bcd6ff", type: "carrier port: power in", pinlabels: [5V, GND]}
  - &PORT_DRV {bgcolor_title: "#bcd6ff", type: "carrier port: stepper driver", pinlabels: [PUL+, PUL-, DIR+, DIR-, ENA+, ENA-], notes: "pluggable screw terminal; the minus pins are GND, ENA+ is not driven yet"}
  - &PORT_BLADE {bgcolor_title: "#bcd6ff", type: "carrier port: blade driver", pinlabels: [EN, GND], notes: "EN switched to GND by a MOSFET on the carrier; pull-down on GPIO18"}
  - &PORT_GNSS
    bgcolor_title: "#bcd6ff"
    type: "carrier port: GNSS"
    subtype: shrouded 2x10 header, 2.54 mm
    pinlabels: [1 V_BAT 5V, 2 GND, 9 RXD_GNSS, 10 TXD_GNSS]
    notes: 20 pins, 4 used. Must also take another RTK board later.
  - &PORT_TOF {bgcolor_title: "#bcd6ff", type: "carrier port: ToF", subtype: 9-pin JST-XH, pinlabels: [3V3, GND, SDA, SCL, nc, LPn, INT, GND (NCS), GND (SPI_I2C_N)]}
  - &PORT_DOCK {bgcolor_title: "#bcd6ff", type: "carrier port: dock sense", pinlabels: [DOCK+ via divider, GND]}
  - &TOF8
    bgcolor_title: "#bfe8bf"
    type: VL53L8CX ToF, 8x8 zones
    image: {src: img/tof_8x8.jpg, height: 80}
    hide_disconnected_pins: true
    pinlabels: [VIN, GND, SDA, SCL, MISO, LPn, INT, NCS, SPI_I2C_N]
    notes: "9 bare holes 2.54 mm; a right-angle 9-pin JST-XH header is soldered in. I2C (ST DS14161): NCS and SPI_I2C_N to GND, LPn high, MISO open. Fed 3.3 V; the board has no schematic"
  - &C94
    bgcolor_title: "#bfe8bf"
    type: u-blox C94-M8P RTK board (rover)
    subtype: J8, 2x10 socket
    image: {src: img/c94.jpg, height: 110}
    pinlabels: [1 V_BAT, 2 GND, 9 RXD_GNSS, 10 TXD_GNSS, SMA GNSS, SMA UHF]
    notes: "3.3 V UART, 19200. Pin 20 RADIO_OFF left open. J8 is a socket: the ribbon's IDC plug goes in through a 2x10 pin header with long pins on both sides (to buy). J8 is 2.54 mm and carries the UART on the owned board (checked 2026-11-10)."
  - &ANT_GNSS {bgcolor_title: "#bfe8bf", type: ANN-MS GNSS patch antenna, image: {src: img/ant_gnss.jpg, height: 80}, pinlabels: [SMA]}
  - &ANT_UHF {bgcolor_title: "#bfe8bf", type: "UHF whip, 165 mm", image: {src: img/ant_uhf.jpg, height: 80}, pinlabels: [SMA]}
  - &PHONE {bgcolor_title: "#bfe8bf", type: Galaxy A12 (ROS 2 host), pinlabels: [USB-C]}
  - &HUB
    bgcolor_title: "#ffe08a"
    type: USB-C OTG adapter, 2-in-1 (USB-A data + USB-C charge port)
    pinlabels: [USB-C plug, USB-A data port, USB-C charge in]
  - &USBC_TERM
    bgcolor_title: "#ffe08a"
    type: USB-C plug with 2-pin screw terminal
    pinlabels: [5V, GND, USB-C plug]
  - &DM542T
    bgcolor_title: "#bfe8bf"
    type: DM542T stepper driver
    image: {src: img/dm542t.jpg, height: 110}
    hide_disconnected_pins: true
    pinlabels: [PUL+, PUL-, DIR+, DIR-, ENA+, ENA-, V+, GND, A+, A-, B+, B-]
    notes: "Manual: optocoupler inputs, 270 ohm inside, 4-5 V, 7-16 mA; ENA open = enabled; +V 20-50 V. ENA is not driven by the firmware yet"
  - &STEPPER
    bgcolor_title: "#bfe8bf"
    type: 23HS32-4004S stepper + MG23-G10-D8 gearbox
    image: {src: img/stepper_gearbox.jpg, height: 110}
    pinlabels: [A+ black, A- green, B+ red, B- blue]
    notes: "4 bare leads AWG20, 300 mm (datasheet)"
  - &BLD
    bgcolor_title: "#bfe8bf"
    type: BLD-510B brushless driver
    image: {src: img/bld510b.jpg, height: 110}
    hide_disconnected_pins: true
    pinlabels: [EN, SIG GND, V+, GND, MA, MB, MC, HALL +5V, HA, HB, HC, HALL GND]
    notes: "Manual: EN, F/R, BK are contacts to GND. EN to GND = run on hardware V2.0, stop on V2.4 (read the unit). Speed from the built-in pot; F/R, BK, SV, PG, ALM unused. MA=U, MB=V, MC=W"
  - &BLADE
    bgcolor_title: "#bfe8bf"
    type: 57BLR90-24-01 brushless motor, 24 V 220 W
    image: {src: img/blade_motor.jpg, height: 110}
    pinlabels: [U orange, V green, W brown, +5V red, A yellow, B white, C blue, GND black]
    notes: "8 bare leads, 300 mm; shaft 8 mm D-cut, 25 mm long (maker page); printed blade disc on a flange coupling (to buy)"
  - &BATT
    bgcolor_title: "#ffe08a"
    type: 7S3P Li-ion pack with BMS, 25.9 V
    image: {src: img/battery.jpg, height: 110}
    pinlabels: [+, "-"]
    notes: "Listing: XT60 discharge lead + DC-jack charge lead, 29.4 V 2 A charger; BMS current not stated"
  - &ESTOP
    bgcolor_title: "#ffe08a"
    type: E-stop, battery-disconnect type (proposed)
    image: {src: img/estop.jpg, height: 80}
    pinlabels: [in, out]
    notes: "In the + line after the charge joint; must break about 20 A DC (a 22 mm button's contact block is too small)"
  - &PDIST {bgcolor_title: "#bcd6ff", type: power distribution, pinlabels: [+ in, "- in", + drives, + blade, + buck, "- out"]}
  - &BUCK
    bgcolor_title: "#bfe8bf"
    type: 24 V to 5 V 10 A buck, potted
    image: {src: img/buck.jpg, height: 80}
    pinlabels: [IN+, IN-, OUT 5V, OUT GND]
  - &CHARGE
    bgcolor_title: "#bfe8bf"
    type: charge port, 8 mm magnetic pogo connector, front
    image: {src: img/pogo.jpg, height: 80}
    pinlabels: [+, "-"]
    notes: "36 V 10 A (listing). No wires or plug: centre solder pin (+) and 2 solder tabs on the shell (-)"
  - &ST_POGO
    bgcolor_title: "#bfe8bf"
    type: station contact, the other half of the pogo pair
    image: {src: img/pogo.jpg, height: 80}
    pinlabels: [+, "-"]
    notes: "Live all the time at 29.4 V, max 2 A from the charger; under a roof"
  - &CHARGER
    bgcolor_title: "#ffe08a"
    type: 29.4 V 2 A charger (comes with the battery)
    pinlabels: [+, "-"]
    notes: "DC barrel plug, size not stated; the station gets the matching DC socket"
  - &IDEAL_DIODE
    bgcolor_title: "#ffe08a"
    type: ideal diode module (proposed)
    pinlabels: [IN+, OUT+, GND]
    notes: "Keeps the mower contact dead off the dock, which the dock sense needs"
  - &trace {category: bundle, type: on the carrier board, show_name: false}
