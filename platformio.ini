; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.13.0  ; 8.x breaks micro_ros_platformio (CCFLAGS lists)
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.filesystem = littlefs
board_microros_distro = jazzy
; RMW_UXRCE_MAX_HISTORY 4 -> 10: the 4 receive slots are shared by all subscriptions and
; esp/console messages were dropped while fused_pose + HIL samples filled them (2026-10-27)
board_microros_user_meta = microros.meta

board_build.partitions = huge_app.csv

board_build.linker_script_flags = -Wl,--gc-sections

lib_deps = 
	bblanchon/ContinuousStepper@^3.1.0
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit MPU6050@^2.2.6
	kristijanpruzinac/ESP-DDS@^2.0.10
	stm32duino/STM32duino VL53L8CX@2.1.0
	https://github.com/micro-ROS/micro_ros_platformio
; C++17 for the Clipper2 headers (lib/clipper2)
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D DDS_DATA_SIZE=100
	-D DDS_MAX_TOPICS=9
	-D DDS_MAX_SUBSCRIBERS_PER_TOPIC=3
	-D DDS_MAX_SYNC_SERVICES=0
	-D DDS_MAX_ASYNC_SERVICES=0
	-D CONFIG_ARDUINO_RUNNING_CORE=0
	-D CONFIG_ARDUINO_LOOP_STACK_SIZE=3072
	; Eigen's run-time checks made a TinyMPC solve ~170x slower (25 ms instead of 0.15 ms per iteration)
	-D EIGEN_NO_DEBUG
	; VL53L8CX ULD: only distance, status and target count are read; the rest off keeps one
	; 8x8 frame ~300 B over I2C (~7 ms per sensor at 400 kHz)
	-D VL53L8CX_DISABLE_AMBIENT_PER_SPAD
	-D VL53L8CX_DISABLE_NB_SPADS_ENABLED
	-D VL53L8CX_DISABLE_SIGNAL_PER_SPAD
	-D VL53L8CX_DISABLE_RANGE_SIGMA_MM
	-D VL53L8CX_DISABLE_REFLECTANCE_PERCENT
	-D VL53L8CX_DISABLE_MOTION_INDICATOR

; Hardware-in-the-loop against the simulator (ros2_ws/src/greentitan_sim). Same firmware, but the
; GNSS/IMU drivers read from micro-ROS and step rates are published back; console mirrored on ROS.
[env:esp32dev_hil]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-D HIL_ENABLED=1
	-D DEBUG_OVER_ROS=1
