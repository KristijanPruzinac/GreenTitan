# lawn.yaml roughened for terrain tests: bumpy turf (crests and dips ~0.6 m apart, ~6 cm
# crest to dip) and a 15 cm plateau with 15 deg flanks, turned 20 deg so east-west infill rows
# cross its corners diagonally. It lies inside a 4 x 4 m test lawn with its corner (the base) at
# the origin, extending to +x, +y; the base-station pad stays flat and clear of the plateau.
# Use: hil.launch.py world:=<share>/config/hills.yaml
world:
  name: hills
  physics: {engine: dart, step: 0.002, real_time_factor: 1.0}
  origin: {latitude: 45.5, longitude: 18.0, altitude: 90.0}

terrain:
  type: mesh
  size: [30.0, 30.0]
  resolution: 0.05
  tile_size: 5.0
  seed: 42
  friction: {mu: 0.5}
  layers:
    - {wavelength: 8.0,  amplitude: 0.02}    # gentle lawn undulation
    - {wavelength: 1.2,  amplitude: 0.02}    # bumps: crest to nearest dip ~6 cm, ~0.5 m apart
    - {wavelength: 0.25, amplitude: 0.004}   # tufts
  features:
    - {type: slope, gradient: [0.03, 0.0]}
    - {type: plateau, position: [2.1, 2.1], size: [1.5, 1.0], yaw: 20.0, height: 0.15,
       slope_deg: 15.0, fillet: 0.15}                                                # the hill
    - {type: flatten, position: [0.0, 0.0], radius: 1.0, blend: 0.2}                # base station

objects:
  - {name: house, shape: {box: [12.0, 0.3, 3.0]}, position: [0.0, 14.0], color: [0.8, 0.75, 0.7]}
  - {name: tree, shape: {cylinder: [0.15, 3.0]}, position: [8.0, 6.0], color: [0.4, 0.25, 0.1]}

gnss_zones:
  - {center: [0.0, 13.0], radius: 4.0, max_state: float}
  - {center: [8.0, 6.0], radius: 3.0, max_state: float}
