# dock.yaml with bumps in the back-out (2026-11-02): 3 cm mounds under one wheel each, 1.1 and 1.4 m out on
# opposite sides, so the set-station back-out and the approach curve and slip. Otherwise as dock.yaml (station
# at the origin facing +x, written in the station's frame; scenarios.py moves it all to a scenario's pose).
# Use: hil.launch.py world:=<share>/config/dock_bumps.yaml
world:
  name: dock_bumps
  physics: {engine: dart, step: 0.002, real_time_factor: 1.0}
  origin: {latitude: 45.5, longitude: 18.0, altitude: 90.0}

terrain:
  type: mesh
  size: [20.0, 20.0]
  resolution: 0.05
  tile_size: 5.0
  seed: 42
  friction: {mu: 0.5}
  layers:
    - {wavelength: 8.0,  amplitude: 0.01}    # barely undulating
    - {wavelength: 1.5,  amplitude: 0.006}   # uneven turf
    - {wavelength: 0.25, amplitude: 0.003}   # tufts
  features:
    - {type: mound, position: [-1.10, 0.19], radius: 0.12, height: 0.03}          # under the left wheel
    - {type: mound, position: [-1.40, -0.17], radius: 0.12, height: 0.03}         # under the right wheel
    - {type: flatten, position: [-0.15, 0.0], radius: 0.7, blend: 0.3}             # station pad

objects:
  - {name: station, type: station, pose: [0.0, 0.0, 0.0]}
  - {name: shed, shape: {box: [0.2, 3.0, 2.0]}, position: [0.75, 0.0], color: [0.75, 0.72, 0.68]}   # the wall the station stands against
