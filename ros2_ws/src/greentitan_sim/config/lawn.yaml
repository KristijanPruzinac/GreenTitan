# A 30 x 30 m garden lawn: gentle undulation, uneven turf, a slight fall to the east,
# a flat base-station pad at the origin, a house wall and a tree that degrade RTK.
world:
  name: lawn
  physics: {engine: dart, step: 0.001, real_time_factor: 1.0}
  origin: {latitude: 45.5, longitude: 18.0, altitude: 90.0}

terrain:
  type: mesh
  size: [30.0, 30.0]
  resolution: 0.05
  tile_size: 5.0
  seed: 42
  friction: {mu: 0.5}
  layers:
    - {wavelength: 8.0,  amplitude: 0.05}    # lawn undulation
    - {wavelength: 1.5,  amplitude: 0.012}   # uneven turf
    - {wavelength: 0.25, amplitude: 0.004}   # tufts
  features:
    - {type: slope, gradient: [0.03, 0.0]}
    - {type: flatten, position: [0.0, 0.0], radius: 1.0, blend: 1.0}                # base station

objects:
  - {name: house, shape: {box: [12.0, 0.3, 3.0]}, position: [0.0, 14.0], color: [0.8, 0.75, 0.7]}
  - {name: tree, shape: {cylinder: [0.15, 3.0]}, position: [8.0, 6.0], color: [0.4, 0.25, 0.1]}

gnss_zones:
  - {center: [0.0, 13.0], radius: 4.0, max_state: float}
  - {center: [8.0, 6.0], radius: 3.0, max_state: float}
