# Garden course (2026-11-01): what real gardens have and edges.yaml doesn't. Lawn and terrain as edges.yaml,
# spawn at the origin facing +x.
#   south: a wall (-6, -4)..(-1, -4), a hedge continuing it but 0.25 m further out (y -3.75, x -0.6..3), then
#     a wall set back 0.2 m (y -4.2, x 3.4..7): two offset steps between wall and hedge, ~0.45 m end to end;
#   north: a curved wall (arc of radius 3.5 m round (0, 3), 20..160 deg, lawn on its concave side);
#   west: a wavy freeform wall along x ~ -8 (y -4..4);
#   east: a free-standing bush (3.5, 2.5)..(5.5, 3.2).
# Hedges are lumps (obstacles.py `hedge`), not boxes: noisy, uneven faces that poke in and out.
# Use: hil.launch.py world:=<share>/config/garden.yaml
world:
  name: garden
  physics: {engine: dart, step: 0.002, real_time_factor: 1.0}
  origin: {latitude: 45.5, longitude: 18.0, altitude: 90.0}

terrain:
  type: mesh
  size: [30.0, 30.0]
  resolution: 0.05
  tile_size: 5.0
  seed: 42
  friction: {mu: 0.5}
  layers:
    - {wavelength: 8.0,  amplitude: 0.01}    # barely undulating
    - {wavelength: 1.5,  amplitude: 0.006}   # uneven turf
    - {wavelength: 0.25, amplitude: 0.003}   # tufts
  features:
    - {type: flatten, position: [0.0, 0.0], radius: 1.0, blend: 1.0}                # base station

objects:
  - {name: south_wall_w, type: wall, height: 1.0, thickness: 0.15, points: [[-6.0, -4.0], [-1.0, -4.0]]}
  - {name: south_hedge, type: hedge, height: 1.1, points: [[-0.6, -3.75], [3.0, -3.75]], seed: 3}
  - {name: south_wall_e, type: wall, height: 1.0, thickness: 0.15, points: [[3.4, -4.2], [7.0, -4.2]]}
  - {name: arc_wall, type: wall, height: 1.0, thickness: 0.15, points: [[3.289, 4.197], [3.031, 4.75], [2.681, 5.25], [2.25, 5.681], [1.75, 6.031], [1.197, 6.289], [0.608, 6.447], [0.0, 6.5], [-0.608, 6.447], [-1.197, 6.289], [-1.75, 6.031], [-2.25, 5.681], [-2.681, 5.25], [-3.031, 4.75], [-3.289, 4.197]]}
  - {name: wavy_wall, type: wall, height: 1.0, thickness: 0.15, points: [[-7.666, -4.0], [-7.502, -3.6], [-7.631, -3.2], [-7.934, -2.8], [-8.145, -2.4], [-8.168, -2.0], [-8.16, -1.6], [-8.268, -1.2], [-8.394, -0.8], [-8.316, -0.4], [-8.0, 0.0], [-7.684, 0.4], [-7.606, 0.8], [-7.732, 1.2], [-7.84, 1.6], [-7.832, 2.0], [-7.855, 2.4], [-8.066, 2.8], [-8.369, 3.2], [-8.498, 3.6], [-8.334, 4.0]]}
  - {name: bush, type: hedge, height: 1.0, radius: [0.2, 0.35], points: [[3.5, 2.5], [5.5, 3.2]], seed: 7}
