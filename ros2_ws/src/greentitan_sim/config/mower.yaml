# GreenTitan Mower V3 for sim_env, wired for hardware-in-the-loop with the ESP32 firmware.
# Robot frame: origin = midpoint of the drive axle on the ground, x forward (towards the big
# drive wheels = front), y left, z up.
# Dimensions: Fusion "Mower V3" v23 body bounding boxes + the 2026-10-26 wheel move (+54.5 mm per
# side); ground = drive wheel bottom (Fusion z 874.2, axle z 949.1). Fusion has no materials, so
# masses are estimates. Values marked "est." are estimates; replace them with measurements
# (docs/HARDWARE.md §8).
robot:
  name: greentitan
  type: wheeled
  # The real Mower V3 parts (frame bars, braces, drive wheels, casters; Fusion STEP) for the ToF
  # line of sight: the sim's ToF rays hit these triangles plus the body boxes below (motors, cover)
  occlusion_mesh_file: package://robot_package/web/mower_v3.json
  body:
    - {name: frame, shape: {box: [0.400, 0.240, 0.020]}, position: [-0.1125, 0.0, 0.119], mass: 0.8, color: [0.7, 0.7, 0.72]}
    - {name: drive_left, shape: {box: [0.057, 0.137, 0.057]}, position: [0.0, 0.092, 0.0755], mass: 2.2, color: [0.15, 0.15, 0.15]}
    - {name: drive_right, shape: {box: [0.057, 0.137, 0.057]}, position: [0.0, -0.092, 0.0755], mass: 2.2, color: [0.15, 0.15, 0.15]}
    - {name: blade_motor, shape: {cylinder: [0.045, 0.100]}, position: [-0.180, 0.0, 0.122], mass: 1.4, color: [0.3, 0.3, 0.3]}
    - {name: blade, shape: {cylinder: [0.127, 0.012]}, position: [-0.180, 0.0, 0.067], mass: 0.3, friction: {mu: 0.3}, color: [0.8, 0.8, 0.8]}  # blade holder 254 mm, 61-73 mm up; mass est.
    # BladeFrame: printed guard around the blade, the lowest part of the body (44.5 mm up); masses est.
    - {name: guard_left,  shape: {box: [0.2214, 0.0465, 0.0834]}, position: [-0.1524,  0.1173, 0.0862], mass: 0.1, friction: {mu: 0.4}, color: [0.3, 0.3, 0.3]}
    - {name: guard_right, shape: {box: [0.2214, 0.0465, 0.0834]}, position: [-0.1524, -0.1173, 0.0862], mass: 0.1, friction: {mu: 0.4}, color: [0.3, 0.3, 0.3]}
    - {name: guard_rear,  shape: {box: [0.0778, 0.2415, 0.1034]}, position: [-0.2936, 0.0, 0.0962], mass: 0.12, friction: {mu: 0.4}, color: [0.3, 0.3, 0.3]}
    - {name: caster_bracket_left,  shape: {box: [0.100, 0.080, 0.026]}, position: [-0.3125,  0.110, 0.115], mass: 0.05, collide: false, color: [0.3, 0.3, 0.3]}  # mass est.
    - {name: caster_bracket_right, shape: {box: [0.100, 0.080, 0.026]}, position: [-0.3125, -0.110, 0.115], mass: 0.05, collide: false, color: [0.3, 0.3, 0.3]}
    - {name: battery, shape: {box: [0.115, 0.080, 0.075]}, position: [-0.080, 0.0, 0.170], mass: 0.7, collide: false, color: [0.1, 0.5, 0.1]}       # est. position
    - {name: electronics, shape: {box: [0.120, 0.160, 0.050]}, position: [-0.260, 0.0, 0.155], mass: 0.8, collide: false, color: [0.2, 0.2, 0.6]}  # est.
    - {name: cover, shape: {box: [0.480, 0.300, 0.140]}, position: [-0.120, 0.0, 0.220], mass: 1.5, friction: {mu: 0.4}, color: [0.85, 0.45, 0.1]}  # est. envelope
  wheels:
    - {name: left,  position: [0.0,  0.18235, 0.0749], radius: 0.0749, width: 0.0375, mass: 0.35, driven: true, friction: {mu: 0.5}}   # plastic on grass, est.
    - {name: right, position: [0.0, -0.18235, 0.0749], radius: 0.0749, width: 0.0375, mass: 0.35, driven: true, friction: {mu: 0.5}}
    # Swivel casters ("SteeringWheel"): vertical axis at x -350.1 mm, wheel r 30.6 mm trailing 34.4 mm
    # behind it (swing radius 65 mm), fork top 102 mm up. Width = CAD wheel box. Masses, mu est.
    - {name: caster_left,  position: [-0.3845,  0.1359, 0.0306], radius: 0.0306, width: 0.050, mass: 0.05, caster: true, caster_joint: swivel,
       swivel: {position: [-0.3501,  0.1359, 0.066], size: [0.058, 0.050, 0.070], mass: 0.06, damping: 0.002}, dynamics: {damping: 0.0005}, friction: {mu: 0.5}}
    - {name: caster_right, position: [-0.3845, -0.1359, 0.0306], radius: 0.0306, width: 0.050, mass: 0.05, caster: true, caster_joint: swivel,
       swivel: {position: [-0.3501, -0.1359, 0.066], size: [0.058, 0.050, 0.070], mass: 0.06, damping: 0.002}, dynamics: {damping: 0.0005}, friction: {mu: 0.5}}
  # 23HS32 (~2.4 Nm holding, ~1.3 Nm pull-out at low speed on 18 V, est.) x 10:1 MG23 x ~0.9
  actuators: {mode: servo, max_torque: 12.0}
  sensors:
    # MPU6050 on the centreline above the drive axle midpoint (2026-10-30): the turning centre, so a
    # spin adds no centripetal acceleration (IMU_X_BEHIND_AXLE 0). On top of the drive bracket, height
    # est.; mounted upside down (matches IMU_INVERT=true)
    - {type: imu, name: imu, position: [0.0, 0.0, 0.11], rpy: [3.14159265, 0.0, 0.0], rate: 200}
    # Phone rear camera looking forward (needs rendering; enable when testing vision):
    # - {type: camera, name: phone_cam, position: [-0.05, 0.0, 0.40], rpy: [0, 0.35, 0], rate: 10, width: 640, height: 480, hfov: 1.2}
  ground_truth: {rate: 50}
  spawn: {position: [0.0, 0.0], yaw: 0.0, clearance: 0.01}

devices:
  # u-blox C94-M8P rover: antenna straight above the blade motor (mower centre), on the centreline. Height est.
  - model: gnss
    name: gnss
    antenna_position: [-0.180, 0.0, 0.28]
    rate: 5.0
    latency: 0.04
    initial_state: fix
    outputs: {ubx_topic: hil/gnss_ubx, fix_topic: sim/gnss/fix, vel_topic: ''}
  # MPU6050 as configured by the firmware: +-4 g, +-500 dps, DLPF 10 Hz. The firmware reads it at
  # 50 Hz; over the link 20 Hz plus the integrated gyro angle give it the same rotation.
  - model: imu
    name: imu
    input: imu
    output_topic: hil/imu
    lpf_hz: 10
    output_rate: 20        # higher rates crowd the micro-ROS input buffers
    gyro_angle: true
    gyro: {range: 8.727, resolution: 0.000266}
    accel: {range: 39.23, resolution: 0.0012}
  # Two ST VL53L8CX 8x8 multizone ToF sensors at the front corners, for wall following while
  # recording outlines. No bench data yet: the zone model is deliberately pessimistic and every
  # number below is est. Mount proposed, crossed (2026-11-02, tools/wall_bench/mount_study.py):
  # each sensor looks 45 deg across the nose to the other side; position and height est.
  # The mower's own parts cut the rays (self_occlusion, robot.occlusion_mesh_file).
  # hil/tof: per sensor 1 byte index, 64 x (uint16 LE mm, uint8 status 5/4/255); see sim_env tof.py.
  - model: tof
    name: tof
    output_topic: hil/tof
    points_topic: sim/tof/points
    frame_id: odom         # world = odom while the datum is the world origin (lawn origin)
    rate: 15.0
    latency: 0.05          # s, est.: ranging mid-frame to the ESP32 having both 8x8 results over I2C
    resolution: 8
    fov_deg: 45.0
    rays_per_zone_side: 6
    max_range: 4.0
    merge_distance: 0.6    # est. (VL53L5CX/L8CX minimum target separation)
    range_17: 2.0          # est. full-zone 17 % target in the dark
    ambient: shade         # dark | shade | sun (sun: range_17 x 0.5, noise x 1.6), est.
    noise_mm: 4.0          # datasheet DS14161: +-11 mm at 20..200 mm, 2.7 sigma
    noise_frac: 0.015      # with bias_frac: datasheet +-5 % (dark) at 2.7 sigma
    bias_frac: 0.01        # fixed per zone, est.
    dropout: 0.02          # est.
    grass_height: 0.03     # est., mowed lawn
    reflectance: {ground: 0.15, wall: 0.5, curb: 0.3, picket: 0.3, rail_fence: 0.3, wire_mesh: 0.35, object: 0.3}  # est.
    sensors:
      # crossed 45 deg in the firmware (TOF_MOUNT_YAW -0.7854: left looks right, right looks left);
      # the sim mounts them 1.5 / 1 deg off that, as a printed holder would be
      - {name: left,  position: [0.11,  0.15, 0.09], rpy: [0.0, 0.0, -0.8115781]}
      - {name: right, position: [0.11, -0.15, 0.09], rpy: [0.0, 0.0,  0.7679449]}
  # DM542T + 23HS32 + MG23-G10. microsteps must match the driver DIP switches (HARDWARE.md §8).
  # No max_step_rate: STEP comes from LEDC hardware (2026-10-27), the firmware clamps speed itself.
  - model: stepper
    name: stepper
    input_topic: hil/stepper_rate
    motors:
      - {joint: left_joint,  steps_per_rev: 200, microsteps: 1, gear_ratio: 10, sign: 1}
      - {joint: right_joint, steps_per_rev: 200, microsteps: 1, gear_ratio: 10, sign: 1}
