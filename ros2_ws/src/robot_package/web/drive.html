<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eef0ea">
<title>GreenTitan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%231f8a3b'/%3E%3C/svg%3E">
<!-- Mower page served by robot_package/web_ui.py (docs/ARCHITECTURE.md §10). One file. The state is pushed by the node
     (/events, server-sent events); the 3D view (default) loads three.js from cdnjs. Light look: a plain white floor with a
     1 m grid, shaped in 3D by the terrain the mower measured, no sky. Offline the page falls back to the 2D view. -->
<style>
:root {
  --bg: #eef0ea; --floor: #f4f5f0; --line: #d3d8cf;
  --glass: rgba(255, 255, 255, .88); --glass2: rgba(255, 255, 255, .98); --edge: rgba(29, 35, 32, .16);
  --ink: #1d2320; --muted: #66706a; --accent: #1f8a3b; --accent-ink: #ffffff;
  --warn: #c27c00; --bad: #c62828; --wall: #56616b; --low: #d08a00; --post: #6a3fb5; --outline: #2f5fb3; --trail: #e07b00;
  --gut: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--floor); color: var(--ink); overflow: hidden;
  font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
#view { position: fixed; inset: 0; }
#view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.glass { background: var(--glass); border: 1px solid var(--edge); box-shadow: 0 3px 12px rgba(29, 35, 32, .14);
  -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2); }

/* top bar: status, 2D/3D, menu */
#top { position: absolute; left: max(var(--gut), env(safe-area-inset-left)); right: max(var(--gut), env(safe-area-inset-right));
  top: max(var(--gut), env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; pointer-events: none; }
#top > * { pointer-events: auto; }
#pill { display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 15px 0 13px; border-radius: 21px; min-width: 0; }
#pill .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
#pill.ok .dot { background: var(--accent); box-shadow: 0 0 0 4px rgba(31, 138, 59, .16); }
#pill.warn .dot { background: var(--warn); box-shadow: 0 0 0 4px rgba(194, 124, 0, .18); }
#pill.bad .dot { background: var(--bad); box-shadow: 0 0 0 4px rgba(198, 40, 40, .16); }
#pill b { font-weight: 700; white-space: nowrap; }
#pill span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.seg { display: flex; height: 42px; border-radius: 21px; padding: 4px; flex: none; }
.seg button { border: 0; background: none; color: var(--muted); font-weight: 700; padding: 0 13px; border-radius: 17px; }
.seg button.on { background: var(--ink); color: #fff; }
.icon { width: 42px; height: 42px; border-radius: 21px; display: grid; place-items: center; padding: 0; flex: none; }
.icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
#recenter { position: absolute; right: max(var(--gut), env(safe-area-inset-right)); top: calc(max(var(--gut), env(safe-area-inset-top)) + 52px); display: none; }
#chips { position: absolute; left: max(var(--gut), env(safe-area-inset-left)); top: calc(max(var(--gut), env(safe-area-inset-top)) + 52px);
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none; max-width: calc(100% - 90px); }
.chip { padding: 6px 12px; border-radius: 15px; font-size: 13px; font-weight: 600; display: none; }
.chip.show { display: block; }
.chip.warn { background: #fdf1db; color: #6b4300; border: 1px solid #ecc77d; }
.chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 7px; }
#toast { position: absolute; left: 50%; top: calc(max(var(--gut), env(safe-area-inset-top)) + 56px); transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 9px 16px; border-radius: 12px; font-weight: 600; text-align: center;
  background: var(--bad); color: #fff; display: none; box-shadow: 0 3px 12px rgba(29, 35, 32, .25); }

/* bottom: Take over / joystick / STOP */
#dock { position: absolute; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right));
  bottom: calc(max(14px, env(safe-area-inset-bottom)) + 12px); height: 150px; pointer-events: none; }
#dock > * { pointer-events: auto; }
#take { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); height: 58px; padding: 0 30px; border-radius: 29px;
  border: 0; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 750; letter-spacing: .01em;
  box-shadow: 0 4px 14px rgba(29, 35, 32, .28); white-space: nowrap; }
#take:active { filter: brightness(.92); }
#take:disabled { opacity: .7; }
body.manual #take { left: auto; right: 0; bottom: 98px; transform: none; height: 44px; padding: 0 18px; font-size: 15px;
  background: var(--glass2); color: var(--ink); border: 1px solid var(--edge); }
#stop { position: absolute; right: 0; bottom: 0; width: 84px; height: 84px; border-radius: 50%; background: var(--bad); color: #fff;
  border: 3px solid #fff; font-size: 17px; font-weight: 800; letter-spacing: .05em; box-shadow: 0 3px 12px rgba(29, 35, 32, .35); }
#stop:active { background: #8e1515; }
body:not(.manual) #stop { width: 64px; height: 64px; font-size: 13px; bottom: 11px; }
#joy { position: absolute; left: 0; bottom: 0; width: 150px; height: 150px; border-radius: 50%; display: none; touch-action: none; }
#joy.glass { border: 2px solid rgba(29, 35, 32, .3); }
body.manual #joy { display: block; }
#joy svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 40% 35%, #56665c, #2a352f); box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
#joy.held #knob { background: radial-gradient(circle at 40% 35%, #4cbf6c, var(--accent)); }

/* menu drawer */
#scrim { position: absolute; inset: 0; background: rgba(29, 35, 32, .18); display: none; }
#scrim.open { display: block; }
#drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 90vw); transform: translateX(105%); transition: transform .2s ease;
  border-radius: 18px 0 0 18px; padding: calc(max(var(--gut), env(safe-area-inset-top)) + 4px) 16px 16px; overflow-y: auto;
  background: var(--glass2); -webkit-user-select: text; user-select: text; }
#drawer.open { transform: none; }
#drawer header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
#drawer h2 { font-size: 18px; margin: 0; }
#drawer h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; font-weight: 700; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #e3e6df; font-size: 14px; }
.row > :first-child { color: var(--muted); }
.row > :last-child { text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.row .ok { color: var(--accent); } .row .warn { color: var(--warn); } .row .bad { color: var(--bad); }
label.tg { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; font-size: 14px; cursor: pointer; }
label.tg input { appearance: none; -webkit-appearance: none; width: 42px; height: 24px; border-radius: 12px; background: #cfd4cc;
  position: relative; margin: 0; cursor: pointer; transition: background .15s; flex: none; }
label.tg input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
label.tg input:checked { background: var(--accent); }
label.tg input:checked::after { left: 21px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid #b9c0b5; background: #f7f8f5; border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.btn:active { background: #e3e6df; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 5px; border-radius: 3px; }
#log { font: 11.5px/1.4 ui-monospace, Menlo, Consolas, monospace; max-height: 38vh; overflow-y: auto; background: #f3f4f1;
  border: 1px solid var(--line); border-radius: 10px; padding: 6px 0; }
#log div { padding: 1px 9px; white-space: pre-wrap; word-break: break-word; }
#log div.wall { background: #fff1cf; color: #6b4300; font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); margin-top: 14px; }
body.touch .hint { display: none; }
@media (max-width: 420px) {
  :root { --gut: 10px; }
  #pill { padding: 0 12px 0 11px; }
  .seg button { padding: 0 10px; }
  #joy { width: 140px; height: 140px; }
}
</style>
</head>
<body>
<div id="view">
  <canvas id="cv"></canvas>
  <div id="top">
    <div id="pill" class="glass bad"><i class="dot"></i><b id="pill-t">Connecting</b><span id="pill-s"></span></div>
    <div class="spacer"></div>
    <div class="seg glass" role="group" aria-label="View"><button id="v2">2D</button><button id="v3">3D</button></div>
    <button id="menu" class="icon glass" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <button id="recenter" class="icon glass" aria-label="Back to the mower"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg></button>
  <div id="chips">
    <div id="c-assist" class="chip glass"><i></i><span></span></div>
    <div id="c-sim" class="chip warn"></div>
    <div id="c-rec" class="chip glass"></div>
  </div>
  <div id="toast"></div>
  <div id="dock">
    <div id="joy" class="glass"><svg viewBox="0 0 150 150"><path d="M75 14v122M14 75h122" stroke="rgba(29,35,32,.18)" stroke-width="2"/>
      <path d="M75 75L60 18A58 58 0 0 1 90 18Z M75 75L60 132A58 58 0 0 0 90 132Z" fill="rgba(31,138,59,.12)"/></svg><div id="knob"></div></div>
    <button id="take">Take over</button>
    <button id="stop">STOP</button>
  </div>
  <div id="scrim"></div>
  <aside id="drawer" aria-label="Menu">
    <header><h2>GreenTitan</h2><button id="close" class="icon" style="background:none;border:0" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <h3>Status</h3>
    <div class="row"><span>Link</span><span id="d-link">--</span></div>
    <div class="row"><span>Position updates</span><span id="d-rate">--</span></div>
    <div class="row"><span>Speed</span><span id="d-speed">--</span></div>
    <div class="row"><span>Wall assist</span><span id="d-assist">--</span></div>
    <div class="row" id="d-sim-row" style="display:none"><span>Sim speed</span><span id="d-sim">--</span></div>
    <h3>Map</h3>
    <div class="row"><span>Terrain</span><span id="d-terrain">--</span></div>
    <label class="tg">Sensor fields<input type="checkbox" id="o-fields"></label>
    <label class="tg">Sensor rays, cut by the mower (3D)<input type="checkbox" id="o-rays"></label>
    <div class="row"><span>Line of sight</span><span id="d-los">--</span></div>
    <label class="tg" id="o-truth-row" style="display:none">Sim truth (debug)<input type="checkbox" id="o-truth"></label>
    <div class="legend" id="legend"></div>
    <h3>Outline capture</h3>
    <div class="btns">
      <button class="btn" data-cmd="capture">Start</button><button class="btn" data-cmd="outline">New outline</button>
      <button class="btn" data-cmd="point">Add point</button><button class="btn" data-cmd="finish">Finish</button>
    </div>
    <h3>Log</h3>
    <div class="btns" style="margin-bottom:8px"><button class="btn" data-cmd="status">Status report</button></div>
    <div id="log"></div>
    <div class="hint">Keys: W A S D or arrows drive (after Take over), Space or Esc stops. 2D: drag pans, wheel zooms. 3D: drag orbits, right-drag pans, wheel zooms.</div>
  </aside>
</div>
<script>
"use strict";
// ---- constants (src/definitions.h) ----
let MAX_LIN = 0.45, MAX_REV = 0.15, MAX_ANG = 0.9;           // m/s, m/s, rad/s; web_ui sends its own (limits)
const DEAD = 0.12, CURVE = 1.7, ANGLE_P = 1.6;               // stick deadzone, speed curve, angle shaping exponent
const ANT_BEHIND = 0.18;                                    // GNSS_ANTENNA_BEHIND_AXLE: base_link is behind the axle
const FRONT = 0.12, REAR = 0.415, HALF_W = 0.20;            // MOWER_* footprint around the axle
// Range sensor mounts (web/sensors.json, a mirror of definitions.h TOF_MOUNT_*; these are the fallback): robot frame
// (ground under the axle midpoint, x forward, y left), m and degrees
let SENSORS = [-1, 1].map(s => ({name: s > 0 ? "ToF left" : "ToF right", shape: "rect", x: 0.11, y: 0.15 * s, z: 0.09,
  yaw: 20 * s, pitch: 0, roll: 0, fov_h: 45, fov_v: 45, zones_h: 8, zones_v: 8, range: 1.5}));
let MESH = null;                                            // web/mower_v3.json: the real Mower V3 parts (mm, robot frame)
const TRAIL_S = 180;                                        // trail fades out over this many seconds
const EXTRAP_MAX = 0.25, SMOOTH_TAU = 0.07;                 // s: pose extrapolation limit, display smoothing
// Map objects by height class only (esp/wall_map kinds: 0 wall, 1 fence, 2 low edge, 3 hedge, 4 post; unknown = tall)
const CLS = {wall: {name: "wall", color: "#56616b", thick: 0.10}, low: {name: "low edge", color: "#d08a00", thick: 0.05},
             post: {name: "post", color: "#6a3fb5"}};
const COL = {floor: "#f4f5f0", grid: "#d9ddd4", axis: "#9aa59a", ink: "#1d2320", muted: "#66706a",
             outline: "#2f5fb3", trail: "#e07b00", accent: "#1f8a3b"};   // the light look (CSS :root has the same)
const clsOf = kind => kind === 2 ? CLS.low : kind === 4 ? CLS.post : CLS.wall;
const ASSIST_TEXT = {ALIGN: "Lining up with the wall", LOCKED: "Following the wall", CORNER: "Inner corner",
                     PIVOT: "Turning at the corner", OUTER: "Rounding the end"};
const THREE_URL = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";

const $ = id => document.getElementById(id);
const DEG = Math.PI / 180;
const now = () => performance.now() / 1000;
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
let view = {x: 0, y: 0, s: 60, follow: true};               // 2D centre (m, odom), px per m
let st = null, lastMsg = 0, logId = 0, worldRev = -1, world = [];
let mapObjs = [], outlines = [], logLines = [], trail = [];
let dirty = true;                                           // redraw needed (new state, input, terrain)

// per-viewer preferences (browser storage may be missing: defaults then)
const prefs = {mode: "3d", fields: false, rays: false, truth: false};
try { Object.assign(prefs, JSON.parse(localStorage.getItem("gt.prefs") || "{}")); } catch (e) {}
if (/^#(2d|3d)$/.test(location.hash)) prefs.mode = location.hash.slice(1);   // a link may pick the view
const savePrefs = () => { try { localStorage.setItem("gt.prefs", JSON.stringify(prefs)); } catch (e) {} };

// ---- server: state pushed over /events, commands posted ----
async function post(path, body) {
  try {
    const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    return await r.json();
  } catch (e) { return null; }
}
const cmd = name => post("/cmd", {cmd: name});

let es = null;
function connect() {
  if (es) es.close();
  try { es = new EventSource("/events?since=" + logId); } catch (e) { es = null; return; }   // opened as a file: no server
  es.onmessage = e => { try { onState(JSON.parse(e.data)); } catch (err) { console.error(err); } };
}
setInterval(() => {                                         // the node pushes at least 4x/s: silence = reconnect
  if (now() - lastMsg > 3 && (!es || es.readyState !== 0)) connect();
  renderStatus();
}, 1000);

const rate = {ts: [], hz: null};
function onState(m) {
  const first = !st;
  st = m; lastMsg = now(); dirty = true;
  if (m.limits) [MAX_LIN, MAX_REV, MAX_ANG] = m.limits;
  if (m.map) mapObjs = m.map;
  if (m.outlines) outlines = m.outlines;
  if (m.log_id < logId) { logLines = []; logId = 0; }       // node restarted
  let added = false;
  for (const [i, s] of m.log || []) if (i > logId) { logLines.push(s); logId = i; added = true; }
  if (added) { logLines = logLines.slice(-30); renderLog(); }
  logId = Math.max(logId, m.log_id);
  if (m.world_rev !== worldRev) loadWorld(m.world_rev);
  if (m.pose && m.pose.n !== pose.n) newPose(m.pose, m.age_pose || 0);
  if (m.terrain) onTerrain(m.terrain);
  if (first || now() - tStatus > 0.2) renderStatus();
  renderDock();
}

async function loadWorld(rev) {
  worldRev = rev;
  if (!rev) { world = []; v3.worldKey = null; return; }
  try { world = (await (await fetch("/world", {cache: "no-store"})).json()).parts || []; } catch (e) { worldRev = -1; }
  dirty = true;
}

// ---- pose: the last EKF pose, extrapolated with its speed and smoothed to the display rate ----
const pose = {n: null, p: null, t: 0, disp: null, tf: 0};
function axleOf(p) { return [p.x + ANT_BEHIND * Math.cos(p.yaw), p.y + ANT_BEHIND * Math.sin(p.yaw)]; }
function newPose(p, age) {
  rate.ts.push([now(), p.n]);                               // poses per second over the last 3 s
  while (rate.ts.length > 2 && now() - rate.ts[0][0] > 3) rate.ts.shift();
  const [t0, n0] = rate.ts[0], span = now() - t0;
  rate.hz = span > 0.5 && p.n >= n0 ? (p.n - n0) / span : null;
  pose.n = p.n; pose.p = p; pose.t = now() - Math.min(age, 0.5);
  const [x, y] = axleOf(p), t = now(), last = trail[trail.length - 1];
  if (!last || Math.hypot(x - last[0], y - last[1]) > 0.02) trail.push([x, y, t]);
  while (trail.length && (t - trail[0][2] > TRAIL_S || trail.length > 5000)) trail.shift();
}
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
function poseTarget(t) {                                    // axle pose now: the last pose moved on with v, w
  const p = pose.p;
  let [x, y] = axleOf(p), yaw = p.yaw;
  const dt = Math.min(EXTRAP_MAX, Math.max(0, t - pose.t)), v = p.v || 0, w = p.w || 0;
  if (Math.abs(w) > 1e-3) { x += v / w * (Math.sin(yaw + w * dt) - Math.sin(yaw)); y -= v / w * (Math.cos(yaw + w * dt) - Math.cos(yaw)); }
  else { x += v * dt * Math.cos(yaw); y += v * dt * Math.sin(yaw); }
  return {x, y, yaw: yaw + w * dt};
}
function updateDisp() {                                     // returns true when the drawn mower moved
  const t = now(), dtf = Math.min(0.1, t - pose.tf); pose.tf = t;
  if (!pose.p) { const had = !!pose.disp; pose.disp = null; return had; }
  const g = poseTarget(t), d = pose.disp;
  if (!d || Math.hypot(g.x - d.x, g.y - d.y) > 0.75 || Math.abs(wrap(g.yaw - d.yaw)) > 1.0) { pose.disp = g; return true; }
  const k = 1 - Math.exp(-dtf / SMOOTH_TAU);
  const nx = d.x + (g.x - d.x) * k, ny = d.y + (g.y - d.y) * k, nyaw = d.yaw + wrap(g.yaw - d.yaw) * k;
  const moved = Math.abs(nx - d.x) + Math.abs(ny - d.y) + Math.abs(nyaw - d.yaw) > 1e-5;
  pose.disp = {x: nx, y: ny, yaw: nyaw};
  return moved;
}

// ---- terrain: ground heights the mower measured (web_ui Terrain: 0.25 m cells, mm above the start) ----
// The cells are spread into a smooth field on the same grid: a fine blur (0.25 m) where the cells are dense, a wide one
// (1 m) to bridge gaps between tracks, and the field fades to flat within ~3 m of the last data, at the median height
// (fading to the start height instead put a rim round a lawn on a slope). Display only.
const TER = {cells: new Map(), epoch: 0, rev: 0, built: -1, t: -9, field: null, cell: 0.25};
const T_MARGIN = 18, T_SF = 1, T_SW = 4;                    // cells: field margin around the data, fine and wide sigma
function onTerrain(m) {
  if (m.reset || m.epoch !== TER.epoch) TER.cells.clear();
  TER.epoch = m.epoch; TER.cell = m.cell || 0.25;
  for (const [i, j, mm] of m.c) TER.cells.set(i + "," + j, [i, j, mm / 1000]);
  TER.rev++; dirty = true;
}
function blur(a, nx, ny, sig) {                             // separable Gaussian, peak weight 1, out to 4 sigma
  const R = Math.ceil(4 * sig), k = [];
  for (let d = -R; d <= R; d++) k.push(Math.exp(-d * d / (2 * sig * sig)));
  const t = new Float32Array(nx * ny), o = new Float32Array(nx * ny);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    let s = 0;
    for (let d = Math.max(-R, -i); d <= R && i + d < nx; d++) s += a[j * nx + i + d] * k[d + R];
    t[j * nx + i] = s;
  }
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    let s = 0;
    for (let d = Math.max(-R, -j); d <= R && j + d < ny; d++) s += t[(j + d) * nx + i] * k[d + R];
    o[j * nx + i] = s;

  // ground: a plain light floor everywhere, the measured terrain (sync3dGround) where the mower drove, one material.
  // Its colour is set so that flat ground comes out at the floor colour (= the background: no horizon line); slopes
  // shade softly by the sun. Pushed back in depth, so the grid lines on it always win.
  v3.r = r;
  const flatLight = HEMI + SUN * sun.position.clone().normalize().z;
  const floorMat = new T.MeshLambertMaterial({color: new T.Color(COL.floor).multiplyScalar(1 / flatLight),
                                              polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1});
  const floor = new T.Mesh(new T.PlaneGeometry(1200, 1200), floorMat);
  scene.add(floor); v3.floor = floor;
  const ground = new T.Mesh(new T.PlaneGeometry(1, 1), floorMat);
  ground.visible = false; ground.frustumCulled = false; scene.add(ground);
  const grid = new T.LineSegments(new T.BufferGeometry(), new T.LineBasicMaterial({vertexColors: true}));
  grid.frustumCulled = false; scene.add(grid); v3.grid = grid;

  const box = new T.BoxGeometry(1, 1, 1), cyl = new T.CylinderGeometry(1, 1, 1, 20);
  cyl.rotateX(Math.PI / 2);                                   // axis along z
  const clsMat = new Map(Object.values(CLS).map(c => [c, new T.MeshLambertMaterial({color: c.color})]));
  const greyMat = new T.MeshLambertMaterial({color: 0x9aa09b, transparent: true, opacity: 0.45, depthWrite: false});
  const greyEdge = new T.LineBasicMaterial({color: 0x8d938e});
  const blueMat = new T.MeshBasicMaterial({color: COL.outline});
  const group = () => { const g = new T.Group(); scene.add(g); return g; };

  // mower: the real Mower V3 parts (web/mower_v3.json, build3dModel) or, until it loads, a box around the axle
  // (front = drive wheels) with its wheels; a green heading arrow; the sensor fields (build3dSensors)
  const L = FRONT + REAR, bodyGeo = new T.BoxGeometry(L, 2 * HALF_W, BODY_Z1 - BODY_Z0);
  bodyGeo.translate((FRONT - REAR) / 2, 0, (BODY_Z0 + BODY_Z1) / 2);
  const bodyEdges = new T.EdgesGeometry(bodyGeo);
  const mower = group(), boxBody = new T.Group(), model = new T.Group(); mower.add(boxBody, model);
  {                                                         // a soft contact shadow sets the light mower off the floor
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d"), rg = g.createRadialGradient(32, 32, 4, 32, 32, 32);
    rg.addColorStop(0, "rgba(29,35,32,.34)"); rg.addColorStop(0.6, "rgba(29,35,32,.18)"); rg.addColorStop(1, "rgba(29,35,32,0)");
    g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
    const sh = new T.Mesh(new T.PlaneGeometry(L + 0.24, 2 * HALF_W + 0.24),
                          new T.MeshBasicMaterial({map: new T.CanvasTexture(c), transparent: true, depthWrite: false}));
    sh.position.set((FRONT - REAR) / 2, 0, 0.006); mower.add(sh);
  }
  boxBody.add(new T.Mesh(bodyGeo, new T.MeshLambertMaterial({color: 0xf1f4f2})));
  boxBody.add(new T.LineSegments(bodyEdges, new T.LineBasicMaterial({color: 0x56605a})));
  const wheelGeo = new T.CylinderGeometry(WHEEL_R, WHEEL_R, 0.045, 20), dark = new T.MeshLambertMaterial({color: 0x1b1f1d});
  for (const s of [1, -1]) { const w = new T.Mesh(wheelGeo, dark); w.position.set(0, s * (HALF_W + 0.025), WHEEL_R); boxBody.add(w); }
  const arrow = new T.Shape(ARROW.map(([x, y]) => new T.Vector2(x, y)));
  const am = new T.Mesh(new T.ShapeGeometry(arrow), new T.MeshBasicMaterial({color: COL.accent, side: T.DoubleSide, transparent: true, opacity: 0.9}));
  am.position.z = BODY_Z1 + 0.005; mower.add(am);
  const fields = new T.Group(), rays = new T.Group(); mower.add(fields, rays);
  // true mower (sim): dashed outline of the same box
  const truth = new T.LineSegments(bodyEdges, new T.LineDashedMaterial({color: COL.ink, dashSize: 0.04, gapSize: 0.03, transparent: true, opacity: 0.6}));
  truth.computeLineDistances(); scene.add(truth);
  // trail: a flat ribbon on the ground
  const N = 5000, trailGeo = new T.BufferGeometry();
  trailGeo.setAttribute("position", new T.BufferAttribute(new Float32Array(N * 18), 3));
  const trailMesh = new T.Mesh(trailGeo, new T.MeshBasicMaterial({color: COL.trail, transparent: true, opacity: 0.55, side: T.DoubleSide, depthWrite: false}));
  trailMesh.frustumCulled = false; scene.add(trailMesh);

  Object.assign(v3, {r, scene, cam3, box, cyl, clsMat, greyMat, greyEdge, blueMat, mower, boxBody, model, arrow3: am, fields, rays,
    truth, trailGeo, ground,
    mapG: group(), worldG: group(), outG: group(), dot: new T.CircleGeometry(0.03, 12), bigDot: new T.CircleGeometry(0.05, 12)});
  for (const g of [box, cyl, v3.dot, v3.bigDot]) g.userData.shared = true;
  r.domElement.style.display = "none";
  $("view").insertBefore(r.domElement, $("top"));
  bind3dInput(r.domElement);
  v3.ready = true;
  build3dModel(); build3dSensors();
}

// ---- the real mower and its sensors' line of sight ----
const PART_MAT = {frame: [0xb9c0c6, 70], brace: [0x6c7378, 40], wheel: [0x161818, 8], caster: [0x55595c, 30], tyre: [0x161818, 8]};
function build3dModel() {
  if (!v3.ready || !MESH || v3.model.children.length) return;
  for (const p of MESH.parts) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(p.pos.map(v => v / 1000), 3));
    g.setIndex(p.idx); g.computeVertexNormals();
    const kind = p.kind === "caster" && /Wheel\/Wheel/.test(p.name) ? "tyre" : p.kind, [color, shininess] = PART_MAT[kind] || PART_MAT.frame;
    const m = new THREE.Mesh(g, new THREE.MeshPhongMaterial({color, shininess, side: THREE.DoubleSide}));   // both sides: rays from inside count
    m.userData.part = p.name; v3.model.add(m);
  }
  v3.boxBody.visible = false;
  let top = 0;
  for (const p of MESH.parts) for (let i = 2; i < p.pos.length; i += 3) top = Math.max(top, p.pos[i] / 1000);
  v3.arrow3.position.z = top + 0.005;
  build3dSensors();
}

// Each sensor: a translucent frustum (rect) or cone from its mount, and its rays (zone centres; cone: centre and two
// rings) cut where they hit the mower's own parts: free rays blue to full range, blocked ones dark orange to the hit.
function build3dSensors() {
  if (!v3.ready) return;
  clearGroup(v3.fields); clearGroup(v3.rays);
  const T = THREE, hasModel = v3.model.children.length > 0, cast = new T.Raycaster(), los = [];
  v3.mower.updateMatrixWorld(true);                         // the raycaster works in world coordinates
  for (const s of SENSORS) {
    const g = new T.Group();
    g.position.set(s.x, s.y, s.z); g.rotation.set((s.roll || 0) * DEG, -(s.pitch || 0) * DEG, s.yaw * DEG, "ZYX");
    g.updateMatrix();
    const R = s.range, color = s.shape === "cone" ? 0x1f8a8a : 0x2f5fb3;
    const fMat = new T.MeshBasicMaterial({color, transparent: true, opacity: 0.10, side: T.DoubleSide, depthWrite: false});
    const eMat = new T.LineBasicMaterial({color, transparent: true, opacity: 0.4});
    const dirs = [];
    if (s.shape === "cone") {
      const geo = new T.ConeGeometry(R * Math.tan(s.fov / 2 * DEG), R, 32, 1, true);
      geo.rotateZ(Math.PI / 2); geo.translate(R / 2, 0, 0);   // tip at the mount, opening along +x
      g.add(new T.Mesh(geo, fMat));
      dirs.push([1, 0, 0]);
      for (const f of [0.5, 1]) for (let k = 0; k < 8; k++) {
        const t = Math.tan(f * s.fov / 2 * DEG), a = k * Math.PI / 4;
        dirs.push([1, t * Math.cos(a), t * Math.sin(a)]);
      }
    } else {
      const th = Math.tan(s.fov_h / 2 * DEG) * R, tv = Math.tan(s.fov_v / 2 * DEG) * R;
      const fc = [[R, th, tv], [R, -th, tv], [R, -th, -tv], [R, th, -tv]], tri = [];
      for (let i = 0; i < 4; i++) tri.push(0, 0, 0, ...fc[i], ...fc[(i + 1) % 4]);
      const fGeo = new T.BufferGeometry(); fGeo.setAttribute("position", new T.Float32BufferAttribute(tri, 3));
      const eGeo = new T.BufferGeometry(); eGeo.setAttribute("position", new T.Float32BufferAttribute(
        fc.flatMap((c, i) => [0, 0, 0, ...c, ...c, ...fc[(i + 1) % 4]]), 3));
      g.add(new T.Mesh(fGeo, fMat), new T.LineSegments(eGeo, eMat));
      const nh = s.zones_h || 8, nv = s.zones_v || 8;
      for (let j = 0; j < nv; j++) for (let i = 0; i < nh; i++)   // zone centres: angle steps, row 0 = top, col 0 = left
        dirs.push([1, Math.tan(((nh - 1) / 2 - i) / nh * s.fov_h * DEG), Math.tan(((nv - 1) / 2 - j) / nv * s.fov_v * DEG)]);
    }
    v3.fields.add(g);
    // rays in the mower frame (range is radial), cast against the model where the mower stands now
    const o = new T.Vector3(s.x, s.y, s.z), pos = [], col = [], free = [0.18, 0.37, 0.70], hit = [0.78, 0.30, 0.05];
    let blocked = 0;
    for (const d0 of dirs) {
      const d = new T.Vector3(...d0).normalize().applyEuler(g.rotation);
      let end = R;
      if (hasModel) {
        const ow = o.clone().applyMatrix4(v3.mower.matrixWorld), dw = d.clone().transformDirection(v3.mower.matrixWorld);
        cast.set(ow, dw); cast.near = 0.005; cast.far = end;
        const h = cast.intersectObjects(v3.model.children, false)[0];
        if (h) { end = h.distance; blocked++; }
        pos.push(...o.toArray(), ...o.clone().addScaledVector(d, end).toArray()); col.push(...(h ? hit : free), ...(h ? hit : free));
      } else {
        pos.push(...o.toArray(), ...o.clone().addScaledVector(d, end).toArray()); col.push(...free, ...free);
      }
    }
    const rg = new T.BufferGeometry();
    rg.setAttribute("position", new T.Float32BufferAttribute(pos, 3)); rg.setAttribute("color", new T.Float32BufferAttribute(col, 3));
    v3.rays.add(new T.LineSegments(rg, new T.LineBasicMaterial({vertexColors: true, transparent: true, opacity: 0.8})));
    los.push(`${s.name}: ${hasModel ? `${dirs.length - blocked}/${dirs.length} clear` : "no model"}`);
  }
  v3.los = los;
  $("d-los").textContent = los.join(" · ");
  dirty = true;
}

async function loadMowerData() {
  try {
    const j = await (await fetch("/web/sensors.json")).json();
    if (Array.isArray(j.sensors) && j.sensors.length) { SENSORS = j.sensors; build3dSensors(); dirty = true; }
  } catch (e) {}
  try { MESH = await (await fetch("/web/mower_v3.json")).json(); build3dModel(); } catch (e) { MESH = null; }
}

function clearGroup(g) {                                    // frees the group's own geometries, not the shared ones
  for (const c of [...g.children]) { g.remove(c); if (c.geometry && !c.geometry.userData.shared) c.geometry.dispose(); }
}

// ground: the terrain field as a mesh, one vertex per cell centre; outside it the flat floor (same material, so no seam);
// the grid flat on the floor and draped over the field
function sync3dGround() {
  const f = TER.field, key = f ? f.rev : null;
  if (key === v3.groundKey) return;
  v3.groundKey = key;
  const m = v3.ground;
  m.visible = !!f;
  // the flat floor around it, with a hole where the field is (the field's edge is at the base height)
  const L = v3.floor, x0 = f ? (f.i0 + 0.5) * f.cell : 0, y0 = f ? (f.j0 + 0.5) * f.cell : 0;
  const x1 = f ? x0 + (f.nx - 1) * f.cell : 0, y1 = f ? y0 + (f.ny - 1) * f.cell : 0, hole = f ? [x0, y0, x1, y1].join() : "";
  if (L.userData.hole !== hole) {
    const R = 600, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, s = new THREE.Shape();
    s.moveTo(cx - R, cy - R); s.lineTo(cx + R, cy - R); s.lineTo(cx + R, cy + R); s.lineTo(cx - R, cy + R); s.closePath();
    if (f) { const h = new THREE.Path(); h.moveTo(x0, y0); h.lineTo(x0, y1); h.lineTo(x1, y1); h.lineTo(x1, y0); h.closePath(); s.holes.push(h); }
    L.geometry.dispose(); L.geometry = new THREE.ShapeGeometry(s); L.userData.hole = hole;
  }
  L.position.z = f ? f.base : 0;
  sync3dGrid(f, x0, y0, x1, y1);
  if (!f) return;
  if (!m.geometry.userData.dims || m.geometry.userData.dims !== f.nx + "x" + f.ny) {
    m.geometry.dispose();
    const g = new THREE.BufferGeometry(), idx = [];
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(f.nx * f.ny * 3), 3));
    for (let j = 0; j < f.ny - 1; j++) for (let i = 0; i < f.nx - 1; i++) {
      const k = j * f.nx + i;
      idx.push(k, k + 1, k + f.nx, k + 1, k + f.nx + 1, k + f.nx);
    }
    g.setIndex(idx); g.userData.dims = f.nx + "x" + f.ny;
    m.geometry = g;
  }
  const g = m.geometry, pos = g.attributes.position.array;
  for (let j = 0; j < f.ny; j++) for (let i = 0; i < f.nx; i++) {
    const k = j * f.nx + i;
    pos[3 * k] = (f.i0 + i + 0.5) * f.cell; pos[3 * k + 1] = (f.j0 + j + 0.5) * f.cell; pos[3 * k + 2] = f.h[k];
  }
  g.attributes.position.needsUpdate = true; g.computeVertexNormals(); g.computeBoundingSphere();
  v3.mapKey = v3.outKey = v3.trailN = null;                 // they sit on the ground: lift them again
}

// The 1 m grid (axes darker): flat lines at the floor height outside the field, pieces of one cell over it, just above
// the terrain, so raised ground never hides it.
function sync3dGrid(f, fx0, fy0, fx1, fy1) {
  const pos = [], col = [], cg = new THREE.Color(COL.grid), ca = new THREE.Color(COL.axis), G = GRID_M;
  const zf = (f ? f.base : 0) + 0.002, step = f ? f.cell : 1;
  const seg = (ax, ay, az, bx, by, bz, c) => { pos.push(ax, ay, az, bx, by, bz); col.push(c.r, c.g, c.b, c.r, c.g, c.b); };
  for (let k = -G; k <= G; k++) for (const along of [0, 1]) {   // along 0: the line x = k (runs in y); 1: the line y = k
    const c = k === 0 ? ca : cg, P = (u, v) => along ? [v, u] : [u, v];
    const [lo, hi] = along ? [fy0, fy1] : [fx0, fx1], [a0, a1] = along ? [fx0, fx1] : [fy0, fy1];
    const inside = f && k > lo && k < hi && a1 > -G && a0 < G;
    if (!inside) { seg(...P(k, -G), zf, ...P(k, G), zf, c); continue; }
    const b0 = Math.max(-G, a0), b1 = Math.min(G, a1);
    if (b0 > -G) seg(...P(k, -G), zf, ...P(k, b0), zf, c);
    if (b1 < G) seg(...P(k, b1), zf, ...P(k, G), zf, c);
    const n = Math.max(1, Math.ceil((b1 - b0) / step));
    for (let i = 0; i < n; i++) {
      const [px, py] = P(k, b0 + (b1 - b0) * i / n), [qx, qy] = P(k, b0 + (b1 - b0) * (i + 1) / n);
      seg(px, py, heightAt(px, py) + 0.01, qx, qy, heightAt(qx, qy) + 0.01, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  v3.grid.geometry.dispose(); v3.grid.geometry = g;
}

function sync3dMap() {
  const key = mapObjs.map(m => m.slice(0, 6).join(",")).join(";");   // hits change all the time: not part of the key
  if (key === v3.mapKey) return;
  v3.mapKey = key; clearGroup(v3.mapG);
  for (const [kind, x0, y0, x1, y1, hc] of mapObjs) {
    const c = clsOf(kind), h = Math.max(0.02, hc / 100), m = new THREE.Mesh(c === CLS.post ? v3.cyl : v3.box, v3.clsMat.get(c));
    if (c === CLS.post) {
      const r = Math.max(0.02, x1 / 100);
      m.scale.set(r, r, h); m.position.set(x0 / 100, y0 / 100, heightAt(x0 / 100, y0 / 100) + h / 2);
    } else {
      const th = c.thick, l = Math.hypot(x1 - x0, y1 - y0) / 100;
      const cx = (x0 + x1) / 200, cy = (y0 + y1) / 200;
      m.scale.set(l + th, th, h); m.position.set(cx, cy, heightAt(cx, cy) + h / 2);
      m.rotation.z = Math.atan2(y1 - y0, x1 - x0);
    }
    v3.mapG.add(m);
  }
}

function sync3dWorld() {
  const key = prefs.truth ? world : null;
  if (key === v3.worldKey) return;
  v3.worldKey = key; clearGroup(v3.worldG);
  if (!key) return;
  for (const p of world) {
    const [z0, z1] = p.z || [0, 0.5];
    const zb = Math.max(0, z0), h = Math.max(0.01, z1 - zb);
    if (p.p) {
      const geo = new THREE.ExtrudeGeometry(new THREE.Shape(p.p.map(([x, y]) => new THREE.Vector2(x, y))), {depth: h, bevelEnabled: false});
      const m = new THREE.Mesh(geo, v3.greyMat), e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), v3.greyEdge);
      m.position.z = e.position.z = zb; v3.worldG.add(m, e);
    } else {
      const m = new THREE.Mesh(v3.cyl, v3.greyMat);
      m.scale.set(p.r, p.r, h); m.position.set(p.c[0], p.c[1], zb + h / 2); v3.worldG.add(m);
    }
  }
}

// a ribbon (half width hw) z above the ground along segments [[ax, ay, bx, by]], into a position array from index 0
function ribbon(pos, segs, hw, z) {
  let k = 0;
  for (const [ax, ay, bx, by] of segs) {
    const l = Math.hypot(bx - ax, by - ay) || 1, nx = -(by - ay) / l * hw, ny = (bx - ax) / l * hw;
    for (const [x, y] of [[ax + nx, ay + ny], [ax - nx, ay - ny], [bx + nx, by + ny], [bx + nx, by + ny], [ax - nx, ay - ny], [bx - nx, by - ny]]) {
      pos[k] = x; pos[k + 1] = y; pos[k + 2] = heightAt(x, y) + z; k += 3;
    }
  }
  return k / 3;
}

function sync3dOutlines() {
  const key = outlines.map(o => o.length + (o.length ? ":" + o[o.length - 1].join(",") : "")).join(";");
  if (key === v3.outKey) return;
  v3.outKey = key; clearGroup(v3.outG);
  for (const o of outlines) {
    if (o.length > 1) {
      const segs = [];
      for (let i = 1; i < o.length; i++) {                  // in pieces of <= 0.2 m, so the line follows the terrain
        const [ax, ay] = o[i - 1], [bx, by] = o[i], n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / 20));
        for (let k = 0; k < n; k++) segs.push([(ax + (bx - ax) * k / n) / 100, (ay + (by - ay) * k / n) / 100,
                                              (ax + (bx - ax) * (k + 1) / n) / 100, (ay + (by - ay) * (k + 1) / n) / 100]);
      }
      const pos = new Float32Array(segs.length * 18); ribbon(pos, segs, 0.015, 0.015);
      const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      v3.outG.add(new THREE.Mesh(g, v3.blueMat));
    }
    for (const [x, y, corner] of o) {
      const d = new THREE.Mesh(corner ? v3.bigDot : v3.dot, v3.blueMat);
      d.position.set(x / 100, y / 100, heightAt(x / 100, y / 100) + 0.02); v3.outG.add(d);
    }
  }
}

function sync3dTrail() {
  const last = trail[trail.length - 1], key = trail.length + (last ? last[2] : 0);
  if (key === v3.trailN) return;
  v3.trailN = key;
  const segs = [];
  for (let i = 1; i < trail.length; i++) {
    const [ax, ay] = trail[i - 1], [bx, by] = trail[i];
    if (Math.hypot(bx - ax, by - ay) <= 1) segs.push([ax, ay, bx, by]);   // pose jump: no ribbon across it
  }
  const g = v3.trailGeo, n = ribbon(g.attributes.position.array, segs.slice(-5000), 0.03, 0.01);
  g.setDrawRange(0, n); g.attributes.position.needsUpdate = true;
}

function render3d() {
  if (!v3.ready) return;
  sync3dGround(); sync3dMap(); sync3dWorld(); sync3dOutlines(); sync3dTrail();
  const p = pose.disp;
  v3.mower.visible = !!p; v3.fields.visible = prefs.fields; v3.rays.visible = prefs.rays;
  if (p) {                                                  // on the terrain, tilted as the accelerometer says
    const tl = st && st.tilt, k = 1 - Math.exp(-Math.min(0.1, now() - (v3.tiltT || 0)) / 0.15);
    v3.tiltT = now();
    if (tl) v3.tilt = [v3.tilt[0] + (tl[0] - v3.tilt[0]) * k, v3.tilt[1] + (tl[1] - v3.tilt[1]) * k];
    v3.mower.position.set(p.x, p.y, heightAt(p.x, p.y)); v3.mower.rotation.set(v3.tilt[0], v3.tilt[1], p.yaw, "ZYX");
  }
  const q = prefs.truth && st && st.truth;
  v3.truth.visible = !!q;
  if (q) { v3.truth.position.set(q.x, q.y, heightAt(q.x, q.y)); v3.truth.rotation.z = q.yaw; }   // truth = axle midpoint
  const c = v3.cam;
  if (view.follow && p) [c.tx, c.ty] = [p.x, p.y];
  const ce = Math.cos(c.el);
  const tz = heightAt(c.tx, c.ty);
  v3.cam3.position.set(c.tx + c.d * ce * Math.cos(c.az), c.ty + c.d * ce * Math.sin(c.az), tz + c.d * Math.sin(c.el));
  v3.cam3.lookAt(c.tx, c.ty, tz);
  v3.r.render(v3.scene, v3.cam3);
}

// orbit (drag), pan (right-drag, shift-drag, two fingers; stops following), zoom (wheel, pinch)
function pan3d(dx, dy) {
  setFollow(false);
  const c = v3.cam, k = c.d * 2 * Math.tan(25 * DEG) / v3.H;
  const rx = -Math.sin(c.az), ry = Math.cos(c.az), fx = -Math.cos(c.az), fy = -Math.sin(c.az), kf = k / Math.max(0.3, Math.sin(c.el));
  c.tx += -rx * dx * k + fx * dy * kf; c.ty += -ry * dx * k + fy * dy * kf;
}
function bind3dInput(el) {
  const ptr = new Map(), c = v3.cam;
  let two = null, btn = 0;
  const zoom = f => { c.d = Math.min(150, Math.max(0.8, c.d * f)); };
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("pointerdown", e => { el.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.offsetX, e.offsetY]); two = null; btn = e.button; });
  el.addEventListener("pointermove", e => {
    if (!ptr.has(e.pointerId)) return;
    const prev = ptr.get(e.pointerId); ptr.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (ptr.size === 1) {
      const dx = e.offsetX - prev[0], dy = e.offsetY - prev[1];
      if (btn === 2 || btn === 1 || e.shiftKey) pan3d(dx, dy);
      else { c.az -= dx * 0.008; c.el = Math.min(1.55, Math.max(0.12, c.el + dy * 0.008)); }
    } else if (ptr.size === 2) {
      const [a, b] = [...ptr.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      if (two) {
        zoom(two.d / Math.max(1, d));
        two.move += Math.hypot(m[0] - two.m[0], m[1] - two.m[1]);
        if (!view.follow || two.move > 12) pan3d(m[0] - two.m[0], m[1] - two.m[1]);   // a pinch alone keeps following
      }
      two = {d, m, move: two ? two.move : 0};
    }
    dirty = true;
  });
  const up = e => { ptr.delete(e.pointerId); two = null; };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  el.addEventListener("wheel", e => { e.preventDefault(); zoom(Math.exp(e.deltaY * 0.0015)); dirty = true; }, {passive: false});
}

// ---- driving: joystick and keys feed one stick, sent at 20 Hz while held ----
// Stick shaping by angle, not per axis: the angle from straight ahead (or straight back) is bent per quadrant,
// a' = 90°·(a/90°)^ANGLE_P (15° -> 5°, 45° -> 30°, 90° -> 90° = turn on the spot), so a stick pushed roughly
// forward drives nearly straight; the distance from the centre sets the speed (deadzone, then the CURVE).
function shapeStick(x, y) {                                  // x right, y up (-1..1) -> [forward, left] (-1..1)
  const m = Math.min(1, Math.hypot(x, y));
  if (m < DEAD) return [0, 0];
  const mag = Math.pow((m - DEAD) / (1 - DEAD), CURVE);
  const a = Math.atan2(x, y), back = Math.abs(a) > Math.PI / 2;
  const off = back ? Math.PI - Math.abs(a) : Math.abs(a);   // 0..90° from the forward or backward axis
  const off2 = Math.PI / 2 * Math.pow(off / (Math.PI / 2), ANGLE_P);
  const a2 = Math.sign(a) * (back ? Math.PI - off2 : off2);
  return [mag * Math.cos(a2), -mag * Math.sin(a2)];
}
const drive = {joy: null, keys: new Set(), active: false};
function stick() {                                          // [fwd -1..1, left -1..1] or null
  if (drive.joy) return shapeStick(drive.joy[0], drive.joy[1]);
  const k = drive.keys;
  if (!k.size) return null;
  return [(k.has("f") ? 1 : 0) - (k.has("b") ? 1 : 0), (k.has("l") ? 1 : 0) - (k.has("r") ? 1 : 0)];
}
function sendStick() {
  const s = stick();
  if (s) {
    drive.active = true;
    post("/drive", {lin: s[0] >= 0 ? s[0] * MAX_LIN : s[0] * MAX_REV, ang: s[1] * MAX_ANG, held: true});
  } else if (drive.active) {
    drive.active = false;
    post("/drive", {held: false});
  }
}
setInterval(sendStick, 50);
function release() { drive.joy = null; drive.keys.clear(); knob(0, 0); $("joy").classList.remove("held"); sendStick(); }

const joy = $("joy");
function knob(x, y) { $("knob").style.transform = `translate(${x}px, ${y}px)`; }
function joyMove(e) {
  const r = joy.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - r.left - R, dy = e.clientY - r.top - R;
  const d = Math.hypot(dx, dy), lim = R - 18;
  if (d > lim) { dx *= lim / d; dy *= lim / d; }
  knob(dx, dy);
  drive.joy = [dx / lim, -dy / lim];
}
joy.addEventListener("pointerdown", e => { joy.setPointerCapture(e.pointerId); joy.classList.add("held"); joyMove(e); sendStick(); });
joy.addEventListener("pointermove", e => { if (drive.joy) joyMove(e); });
joy.addEventListener("pointerup", release); joy.addEventListener("pointercancel", release);

const KEYMAP = {KeyW: "f", ArrowUp: "f", KeyS: "b", ArrowDown: "b", KeyA: "l", ArrowLeft: "l", KeyD: "r", ArrowRight: "r"};
window.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "Escape") { e.preventDefault(); stopAll(); return; }
  const k = KEYMAP[e.code];
  if (!k || e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault();
  if (st && st.manual === false) { if (!e.repeat) toast("Tap Take over to drive"); return; }
  if (!drive.keys.has(k)) { drive.keys.add(k); sendStick(); }    // OS key repeat is ignored: the 20 Hz timer sends
});
window.addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) { drive.keys.delete(k); sendStick(); } });
window.addEventListener("blur", release);
document.addEventListener("visibilitychange", () => { if (document.hidden) release(); });

function stopAll() { drive.joy = null; drive.keys.clear(); drive.active = false; knob(0, 0); joy.classList.remove("held"); cmd("stop"); }

// ---- status, dock, drawer ----
const ageText = a => a == null ? "never" : a < 10 ? a.toFixed(1) + " s" : Math.round(a) + " s";
const ageCls = a => a == null || a > 2 ? "bad" : a > 0.5 ? "warn" : "ok";
const live = () => st && now() - lastMsg < 1.5;

function setText(id, text, cls) { const e = $(id); e.textContent = text; e.className = cls || ""; }
let tStatus = 0;
function renderStatus() {
  const pill = $("pill");
  tStatus = now();
  if (!live()) {
    pill.className = "glass bad"; setText("pill-t", st ? "Offline" : "Connecting"); setText("pill-s", "");
    setText("d-link", "page server not reachable", "bad");
    $("c-assist").classList.remove("show"); $("c-sim").classList.remove("show");
    return;
  }
  const esp = [st.age_imu, st.age_log].filter(a => a != null), ageEsp = esp.length ? Math.min(...esp) : null;
  const ce = ageCls(ageEsp), cp = ageCls(st.age_pose), worst = [ce, cp].includes("bad") ? "bad" : [ce, cp].includes("warn") ? "warn" : "ok";
  const v = st.pose ? st.pose.v : 0;
  pill.className = "glass " + worst;
  setText("pill-t", ce === "bad" ? "Mower not connected" : cp === "bad" ? "No position" : st.manual ? "Manual" : "Ready");
  setText("pill-s", worst === "bad" ? "" : Math.abs(v) >= 0.02 ? Math.abs(v).toFixed(2) + " m/s" : worst === "warn" ? "weak link" : "");
  setText("d-link", "mower " + ageText(ageEsp) + " · position " + ageText(st.age_pose), worst);
  setText("d-rate", rate.hz == null || st.age_pose == null || st.age_pose > 2 ? "--" : rate.hz.toFixed(1) + " /s");
  setText("d-speed", st.pose ? `${st.pose.v.toFixed(2)} m/s · ${(st.pose.w >= 0 ? "+" : "") + st.pose.w.toFixed(2)} rad/s` : "--");
  const as = st.assist_state || "FREE";
  setText("d-assist", st.assist === false ? "off" : st.assist == null ? "?" : as + (st.assist_why ? " · " + st.assist_why : ""));
  const showAssist = st.manual && st.assist !== false && as !== "FREE";
  $("c-assist").classList.toggle("show", !!showAssist);
  if (showAssist) $("c-assist").querySelector("span").textContent = ASSIST_TEXT[as] || as[0] + as.slice(1).toLowerCase();
  // sim speed (HIL only): the firmware runs on wall time, so a slow sim makes driving and the wall map invalid
  $("d-sim-row").style.display = st.rtf == null ? "none" : "";
  if (st.rtf != null) setText("d-sim", st.rtf.toFixed(2) + "x" + (st.rtf >= 0.95 ? " (real time)" : " (too slow)"), st.rtf >= 0.95 ? "ok" : st.rtf >= 0.85 ? "warn" : "bad");
  $("c-sim").textContent = st.rtf != null ? `Sim at ${st.rtf.toFixed(2)}x: driving and walls not valid` : "";
  $("c-sim").classList.toggle("show", st.rtf != null && st.rtf < 0.95);
  $("c-rec").textContent = "Recording outline";
  $("c-rec").classList.toggle("show", !!st.recording);
  $("o-truth-row").style.display = st.world_rev ? "" : "none";
  if (st.notice === "stick lost: stopped" && drive.active) toast("Stick signal lost: stopped");
}

const take = {pending: 0};
function renderDock() {
  const manual = !!(st && st.manual);
  if (take.pending && (manual === (take.pending > 0) || now() - Math.abs(take.pending) > 4)) {
    if (manual !== (take.pending > 0)) toast("No answer from the mower");
    take.pending = 0;
  }
  document.body.classList.toggle("manual", manual);
  const b = $("take");
  b.textContent = take.pending > 0 ? "Taking over…" : take.pending < 0 ? "Handing back…" : manual ? "Done" : "Take over";
  b.disabled = !!take.pending;
  if (!manual && drive.joy) release();
}
$("take").addEventListener("click", () => {
  const manual = !!(st && st.manual);
  take.pending = manual ? -now() : now();
  if (manual) release();
  cmd(manual ? "handback" : "takeover");
  renderDock();
});

let toastTimer = 0;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", 3500);
}

function renderLog() {
  if (!$("drawer").classList.contains("open")) return;
  const el = $("log"), atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
  el.replaceChildren(...logLines.map(s => { const d = document.createElement("div"); d.textContent = s; if (s.includes("[WALL]")) d.className = "wall"; return d; }));
  if (atEnd) el.scrollTop = el.scrollHeight;
}

function openDrawer(open) {
  $("drawer").classList.toggle("open", open); $("scrim").classList.toggle("open", open);
  if (open) { renderLog(); const el = $("log"); el.scrollTop = el.scrollHeight; }
}
$("menu").onclick = () => openDrawer(true);
$("close").onclick = $("scrim").onclick = () => openDrawer(false);
for (const b of document.querySelectorAll("[data-cmd]")) b.onclick = () => cmd(b.dataset.cmd);
$("legend").innerHTML = [[CLS.wall.color, "wall"], [CLS.low.color, "low edge"], [CLS.post.color, "post"], [COL.outline, "outline"], [COL.trail, "trail"]]
  .map(([c, n]) => `<span><i style="background:${c}"></i>${n}</span>`).join("");
for (const k of ["fields", "rays", "truth"]) {
  const el = $("o-" + k); el.checked = !!prefs[k];
  el.onchange = () => { prefs[k] = el.checked; savePrefs(); dirty = true; };
}

$("stop").addEventListener("pointerdown", e => { e.preventDefault(); stopAll(); });   // no wait for click on touch
$("stop").addEventListener("click", stopAll);
$("recenter").onclick = () => setFollow(true);
$("v2").onclick = () => { prefs.mode = "2d"; savePrefs(); setMode("2d"); };
$("v3").onclick = () => { prefs.mode = "3d"; savePrefs(); setMode("3d"); };
for (const b of document.querySelectorAll("button")) b.addEventListener("click", () => b.blur());   // Space = stop, not "press again"

window.addEventListener("resize", () => { if (v3.on) resize3d(); resize(); });
if (matchMedia("(pointer: coarse)").matches) document.body.classList.add("touch");
resize(); renderSeg(prefs.mode); renderDock(); connect(); loadMowerData(); requestAnimationFrame(frame);
setMode(prefs.mode === "2d" ? "2d" : "3d");
</script>
</body>
